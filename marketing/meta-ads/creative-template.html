<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>DIESELCRAFT — Meta Ads creative</title>
<style>
  :root { --red:#e3262e; --ink:#0b0b0c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#000; }
  body { font-family:'Bahnschrift SemiBold Condensed','Bahnschrift','Arial Narrow',Impact,sans-serif; }

  #ad { position:relative; overflow:hidden; background:var(--ink); color:#fff; }
  #photo { position:absolute; inset:0; background-size:cover;
           filter:grayscale(1) contrast(1.18) brightness(.82); }
  #shade { position:absolute; inset:0; }
  #glow  { position:absolute; inset:0;
           background:radial-gradient(60% 40% at 85% 12%, rgba(227,38,46,.38), transparent 70%); mix-blend-mode:screen; }
  #grain { position:absolute; inset:0; opacity:.07;
           background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); }

  #content { position:absolute; left:0; right:0; display:flex; flex-direction:column; justify-content:space-between; padding:0 64px; }
  #rest { display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:18px; letter-spacing:.14em; font-size:var(--brand); }
  .brand i { width:10px; height:calc(var(--brand)*1.25); background:var(--red); display:block; }
  .brand b { font-weight:inherit; color:#fff; }
  .brand span { color:#c9c9cc; }
  h1 { font-weight:inherit; text-transform:uppercase; line-height:.93; letter-spacing:.005em;
       font-size:var(--h1); text-shadow:0 6px 40px rgba(0,0,0,.6); }
  h1 em { font-style:normal; color:var(--red); }
  .sub { font-family:'Segoe UI Semibold','Segoe UI',sans-serif; color:#e4e4e6; line-height:1.28;
         font-size:var(--sub); max-width:92%; }
  .cta { display:flex; align-items:stretch; background:rgba(14,14,16,.82); border:2px solid rgba(255,255,255,.14);
         border-left:12px solid var(--red); }
  .cta .t { padding:var(--ctapad); display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .cta .a { font-size:var(--ctasmall); letter-spacing:.06em; color:#fff; text-transform:uppercase; }
  .cta .p { font-size:var(--phone); color:#fff; letter-spacing:.02em; line-height:1; }
  .addr { font-family:'Segoe UI Semibold','Segoe UI',sans-serif; font-size:var(--addr); color:#bdbdc2; letter-spacing:.02em; }
  .addr b { color:#fff; font-weight:600; }
</style>
</head>
<body>
<div id="ad">
  <div id="photo"></div><div id="shade"></div><div id="glow"></div><div id="grain"></div>
  <div id="content">
    <div class="brand"><i></i><b>DIESELCRAFT</b><span>· ОДЕСА</span></div>
    <div id="rest">
      <h1 id="h1"></h1>
      <div class="sub" id="sub"></div>
      <div class="cta"><div class="t">
        <div class="a">Телефонуйте — запишіться на діагностику</div>
        <div class="p">+380 93 383 83 73</div>
      </div></div>
      <div class="addr"><b>Одеса</b>, вул. Академіка Заболотного, 47 (Лески)</div>
    </div>
  </div>
</div>

<script>
const IMG = '../../img/gallery/';
const VARIANTS = {
  a: { photo:'remont-kolenvalu-dyzelnoho-dvyhuna.jpg', pos:{feed:'50% 30%',story:'58% 40%',square:'50% 38%'},
       h1:'Дизель втратив<br><em>потужність?</em>',
       sub:'Діагностика та ремонт дизельних двигунів, форсунок і ТНВД в Одесі.' },
  b: { photo:'dyzelnyi-dvyhun-na-stendi-odesa.jpg', pos:{feed:'50% 55%',story:'52% 50%',square:'50% 55%'},
       h1:'Діагностика<br>замість <em>здогадок</em>',
       sub:'Форсунки, ТНВД, турбіни, ГБЦ, капітальний ремонт двигунів.' },
  c: { photo:'kapremont-dyzelnoho-dvyhuna-odesa.jpg', pos:{feed:'50% 45%',story:'45% 45%',square:'50% 50%'},
       h1:'Не чекай, поки<br>двигун <em>зупиниться!</em>',
       sub:'Дим, троєння, втрата тяги, важкий запуск — це привід для діагностики.' }
};
// Stories/Reels: верх ~250px и низ ~340px закрыты интерфейсом
const FORMATS = {
  feed:   { w:1080, h:1350, top:70,  bottom:70,  h1:122, sub:38, brand:34, phone:84, ctasmall:30, ctapad:'26px 34px', addr:26, gap:30 },
  square: { w:1080, h:1080, top:56,  bottom:56,  h1:98,  sub:32, brand:30, phone:72, ctasmall:27, ctapad:'20px 30px', addr:24, gap:22 },
  story:  { w:1080, h:1920, top:260, bottom:350, h1:138, sub:42, brand:36, phone:92, ctasmall:32, ctapad:'28px 36px', addr:28, gap:38 }
};
const [v, f] = (location.hash.slice(1) || 'a-feed').split('-');
const V = VARIANTS[v], F = FORMATS[f];
const ad = document.getElementById('ad');
ad.style.width = F.w + 'px'; ad.style.height = F.h + 'px';
for (const k of ['brand','h1','sub','phone','ctasmall','addr']) ad.style.setProperty('--' + k, F[k] + 'px');
ad.style.setProperty('--ctapad', F.ctapad);
const photo = document.getElementById('photo');
photo.style.backgroundImage = `url(${IMG + V.photo})`;
photo.style.backgroundPosition = V.pos[f];
const shades = {
  story:  'linear-gradient(180deg,rgba(8,8,9,.55) 0%,rgba(8,8,9,.05) 22%,rgba(8,8,9,.55) 42%,rgba(8,8,9,.94) 62%,rgba(8,8,9,.98) 100%)',
  square: 'linear-gradient(180deg,rgba(8,8,9,.45) 0%,rgba(8,8,9,.05) 18%,rgba(8,8,9,.6) 40%,rgba(8,8,9,.95) 66%,rgba(8,8,9,.98) 100%)',
  feed:   'linear-gradient(180deg,rgba(8,8,9,.5) 0%,rgba(8,8,9,.05) 18%,rgba(8,8,9,.6) 38%,rgba(8,8,9,.95) 62%,rgba(8,8,9,.98) 100%)'
};
document.getElementById('shade').style.background = shades[f];
const c = document.getElementById('content');
c.style.top = F.top + 'px'; c.style.bottom = F.bottom + 'px';
document.getElementById('rest').style.gap = F.gap + 'px';
document.getElementById('h1').innerHTML = V.h1;
document.getElementById('sub').textContent = V.sub;
</script>
</body>
</html>
